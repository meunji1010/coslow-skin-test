<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>코슬로우 2분 피부성향 테스트</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap");
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        padding: 28px 18px;
        display: grid;
        place-items: center;
        background-color: #f0ebff;
        background-image:
          radial-gradient(circle at 12% 15%, #ffd9ec 0, transparent 35%),
          radial-gradient(circle at 90% 85%, #d9edff 0, transparent 40%);
        color: #29233d;
        font-family: "Noto Sans KR", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .card {
        position: relative;
        width: 100%;
        max-width: 460px;
        padding: 34px 26px 26px;
        overflow: hidden;
        background: #ffffff;
        border: 2px solid #29233d;
        border-radius: 30px;
        box-shadow: 7px 8px 0 #c9b7fa;
      }
      /* 카드 오른쪽 위 장식 */
      .card::before {
        content: "✦";
        position: absolute;
        top: 22px;
        right: 25px;
        color: #a88ae8;
        font-size: 34px;
        pointer-events: none;
      }
      .brand {
        display: inline-block;
        margin: 0 0 38px;
        padding: 7px 12px;
        border: 1.5px solid #29233d;
        border-radius: 9px;
        background: #eaff9a;
        color: #29233d;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 2px;
        transform: rotate(-3deg);
      }
      .label {
        display: table;
        margin: 0 0 18px;
        padding: 7px 12px;
        border-radius: 100px;
        background: #f0eaff;
        color: #7950c7;
        font-size: 12px;
        font-weight: 800;
      }
      h1 {
        white-space: pre-line;
        margin: 0 0 20px;
        font-size: clamp(25px, 6.6vw, 32px);
        font-weight: 900;
        line-height: 1.5;
        letter-spacing: -1.2px;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }
      /* 질문이 바뀔 때 생기는 제목 테두리 제거 */
      h1:focus {
        outline: none;
      }
      .description {
        margin: 0;
        color: #827b92;
        font-size: 14px;
        font-weight: 500;
        line-height: 1.85;
        letter-spacing: -0.3px;
        white-space: pre-line;
        word-break: keep-all;
      }
      .answers {
        display: grid;
        gap: 15px;
        margin-top: 34px;
      }
      button {
        width: 100%;
        min-height: 62px;
        padding: 17px 16px;
        border: 2px solid #29233d;
        border-radius: 18px;
        background: #fff;
        color: #29233d;
        box-shadow: 0 4px 0 #29233d;
        font: inherit;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        touch-action: manipulation;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          background-color 0.15s ease;
      }
      .primary {
        background: #bfa0ff;
        color: #25183e;
      }
      @media (hover: hover) {
        button:hover {
          background: #f4eeff;
          transform: translateY(-2px);
          box-shadow: 0 6px 0 #29233d;
        }
        .primary:hover {
          background: #ccb3ff;
        }
      }
      button:active {
        transform: translateY(4px);
        box-shadow: 0 0 0 #29233d;
      }
      button:focus-visible {
        outline: 3px solid #8c5cdb;
        outline-offset: 6px;
      }
      .back {
        width: auto;
        min-height: 44px;
        display: block;
        margin: 22px auto 0;
        padding: 10px 14px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        box-shadow: none;
        color: #898193;
        font-size: 13px;
        font-weight: 600;
      }
      .back:hover,
      .back:active {
        background: #f7f3fc;
        box-shadow: none;
        transform: none;
      }
      .note {
        margin: 28px 0 0;
        padding-top: 18px;
        border-top: 1px dashed #e2daee;
        color: #a099ad;
        font-size: 11px;
        line-height: 1.8;
        word-break: keep-all;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 360px) {
        .card {
          padding: 28px 20px 22px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>

      const label = document.getElementById("label");

      const description = document.getElementById("description");
      const answers = document.getElementById("answers");
      const back = document.getElementById("back");
      let current = -1;
      let responses = [];
      function calculateResults(values) {
        return Object.entries(axisInfo).map(([key, info]) => {
          const scores = questions.flatMap((q, i) => {
            const value = values[i];
            if (
              q.axis !== key ||
              !Number.isInteger(value) ||
              value < 0 ||
              value > 3
            )
              return [];
            return [q.reverse ? 3 - value : value];
          });
          const mean = scores.length
            ? scores.reduce((a, b) => a + b, 0) / scores.length
            : null;
          if (scores.length < 2)
            return {
              code: "?",
              text: info.name + ": 응답 부족",
              tip: "이전 질문으로 돌아가 경험에 맞는 답을 추가할 수 있어요.",
            };
          if (mean === 1.5)
            return {
              code: "?",
              text: info.name + ": 경계 성향",
              tip: "양쪽 특성이 섞여 있어 한쪽으로 구분하기 어려워요.",
            };
          const high = mean > 1.5;
          return {
            code: high ? info.high : info.low,
            text: high ? info.highText : info.lowText,
            tip: high ? info.highTip : info.lowTip,
          };
        });
      }
      function makeButton(text, action, primary = false) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = text;
        if (primary) button.classList.add("primary");
        button.addEventListener("click", action);
        answers.appendChild(button);
      }
      function selectAnswer(value) {
        responses[current] = value;
        responses.length = current + 1;
        current += 1;
        render();
      }
      function restart() {
        current = -1;
        responses = [];
        render();
      }
      function render() {
        answers.replaceChildren();
        back.hidden = current < 0;
        if (current === -1) {
          label.textContent = "12문항 · 약 2~3분";
          title.textContent = "내 피부는 어떤 성향일까요?";
          description.textContent =
            "평소 피부 상태에 가장 가까운 답을 골라주세요.\n12가지 질문으로 나의 피부성향과 관리 포인트를 알아봐요.";
          makeButton(
            "내 피부성향 알아보기",
            () => {
              current = 0;
              render();
            },
            true,
          );
        } else if (current === questions.length) {
          const result = calculateResults(responses);
          const code = result.map((r) => r.code).join("");
          label.textContent = "나의 간편 피부성향 결과";
          const profile = typeResults[code];
          if (profile) {
            title.textContent = code + "\n" + profile.name;
            description.textContent =
              profile.keywords.map((k) => "#" + k).join("  ") +
              "\n\n피부 특징\n" +
              profile.features +
              "\n\n관리 포인트\n" +
              profile.focus +
              "\n\n" +
              profile.tips.map((tip, i) => i + 1 + ". " + tip).join("\n") +
              "\n\n나의 네 가지 성향\n" +
              result.map((r) => r.code + " · " + r.text).join("\n") +
              "\n\n12문항 자체 채점에 따른 참고 결과입니다. W/T는 잔주름과 자외선 관련 응답을 함께 반영하며 실제 탄력을 측정하지 않습니다.";
          } else {
            title.textContent = "내 피부성향을 확인해보세요";
            description.textContent =
              result.map((r) => r.text + "\n" + r.tip).join("\n\n") +
              "\n\n응답이 부족하거나 경계에 해당하는 항목이 있어 16가지 타입 중 하나로 구분하지 않았어요. 이전 질문으로 돌아가 답변을 확인할 수 있어요.";
          }
          makeButton("처음부터 다시 하기", restart, true);
        } else {
          const question = questions[current];
          label.textContent = `질문 ${current + 1} / ${questions.length} · ${question.category}`;
          title.textContent = question.text;
          description.textContent =
            "평소의 나에게 더 가까운 답을 선택해주세요.";

            makeButton(text, () => selectAnswer(i)),
          );
          makeButton("잘 모르겠어요 / 경험이 없어요", () => selectAnswer(null));
        }
        title.focus({ preventScroll: true });
        window.scrollTo({ top: 0, behavior: "auto" });
      }
      back.addEventListener("click", () => {
        if (current < 0) return;
        current -= 1;
        render();
      });
